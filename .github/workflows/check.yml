name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Evaluates every language shell and builds the lightweight Nix and
      # Markdown shells. Heavy shells (Flutter, LaTeX, video, ...) are
      # eval-only so this stays practical.
      - name: Flake check
        run: nix flake check

      - name: Lint
        run: |
          nix --extra-experimental-features 'nix-command flakes' develop --command bash -c '
            statix check .
            deadnix --fail .
            nixfmt --check $(git ls-files "*.nix")
          '
